<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1118"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="bordeauxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#232838" stroke-width="1.5"/>

  <!-- Tree Hierarchy Connectors -->
  <!-- Vertical trunk from root -->
  <path d="M 22 24 L 22 46" stroke="#2a3248" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Branch to Child 1 -->
  <path d="M 22 34 L 32 34" stroke="#2a3248" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Branch to Child 2 -->
  <path d="M 22 46 L 32 46" stroke="#2a3248" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Root Node (Top) -->
  <rect x="14" y="16" width="36" height="8" rx="3" fill="url(#primaryGrad)" filter="url(#glow)"/>
  
  <!-- Child Node 1 (Middle Level) -->
  <rect x="32" y="30" width="22" height="8" rx="3" fill="url(#orangeGrad)"/>

  <!-- Child Node 2 (Bottom Level) -->
  <rect x="32" y="42" width="22" height="8" rx="3" fill="url(#bordeauxGrad)"/>

  <!-- Grid Metric Dot Accent -->
  <circle cx="18" cy="20" r="1.5" fill="#ffffff"/>
  <circle cx="36" cy="34" r="1.5" fill="#ffffff"/>
  <circle cx="36" cy="46" r="1.5" fill="#ffffff"/>
</svg>
