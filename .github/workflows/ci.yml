name: CI / CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-monorepo:
    name: Frontend Monorepo (TypeScript & React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install Monorepo Dependencies
        run: npm ci || npm install

      - name: Typecheck & Build Packages
        run: npm run build --if-present

      - name: Run Frontend Tests
        run: npm run test --if-present

  backend-python:
    name: Backend Companion Engine (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: packages/superset-hierarchical-table-backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy
          pip install -e .

      - name: Run Pytest
        working-directory: packages/superset-hierarchical-table-backend
        run: pytest tests/ -v

  installer-verification:
    name: Verify Installer Script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Test Automated Installer
        run: |
          mkdir -p /tmp/mock-superset/superset-frontend/src/visualizations/presets
          echo '{"name":"superset-frontend","dependencies":{}}' > /tmp/mock-superset/superset-frontend/package.json
          echo 'import { Preset } from "@superset-ui/core"; export default class MainPreset extends Preset { constructor() { super({ plugins: [] }); } }' > /tmp/mock-superset/superset-frontend/src/visualizations/presets/MainPreset.js
          python3 scripts/installer.py --superset-path /tmp/mock-superset --no-docker
          python3 scripts/installer.py --superset-path /tmp/mock-superset --rollback --no-docker
